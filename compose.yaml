services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=mini_lu'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '30432:5432'
    volumes:
      - ./init-scripts:/docker-entrypoint-initdb.d
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
